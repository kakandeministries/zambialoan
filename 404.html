<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kakande Ministries</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f3ff;color:#4c1d95;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{text-align:center;padding:2rem}
  .spinner{border:4px solid rgba(124,58,237,.2);border-top-color:#7c3aed;border-radius:50%;width:44px;height:44px;animation:spin .9s linear infinite;margin:0 auto 1rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:.875rem;opacity:.75;margin:0}
</style>
<script>
  (function () {
    var path = location.pathname || '/';
    var search = location.search || '';

    // Match /cause/<slug> anywhere in the path
    var m = path.match(/\/cause\/([a-z0-9\-_]+)/i);
    var slug = m ? m[1].toLowerCase() : '';

    // Determine base path (strip everything after /cause/ if present)
    var base = path.replace(/\/cause\/[^\/]*.*$/i, '/');
    if (!base || base === '/') base = '/';

    // Preserve any query string the user had
    var suffix = search ? search : '';

    var target;
    if (slug) {
      target = base + '#cause/' + slug + suffix;
    } else {
      target = base + suffix + '#';
    }

    // Redirect immediately (replace, so back button skips the 404)
    location.replace(target);
  })();
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Loading Kakande Ministries&hellip;</p>
  </div>
</body>
</html>
